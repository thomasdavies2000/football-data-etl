name: Nightly ETL

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC — after midnight UK time
  workflow_dispatch:

jobs:
  etl:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e .

      - name: Write .env
        run: |
          printf "DB_NAME=%s\nDB_USER=%s\nDB_PASSWORD=%s\nDB_HOST=%s\nDB_PORT=%s\n" \
            "${{ secrets.DB_NAME }}" \
            "${{ secrets.DB_USER }}" \
            "${{ secrets.DB_PASSWORD }}" \
            "${{ secrets.DB_HOST }}" \
            "${{ secrets.DB_PORT }}" > .env

      - name: Run ETL
        run: python src/main.py --season 2025
