name: Backfill all seasons

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Comma-separated seasons to run (e.g. 1997,1998). Leave blank to run all seasons."
        required: false
        default: ""

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          ALL='[1992,1993,1994,1995,1996,1997,1998,1999,2000,2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024]'
          INPUT="${{ github.event.inputs.seasons }}"
          if [ -z "$INPUT" ]; then
            SEASONS="$ALL"
          else
            SEASONS=$(python3 -c "import sys,json; print(json.dumps([int(x.strip()) for x in '$INPUT'.split(',')]))")
          fi
          echo "matrix={\"season\":$SEASONS}" >> $GITHUB_OUTPUT

  load:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e .

      - name: Write .env
        run: |
          printf "DB_NAME=%s\nDB_USER=%s\nDB_PASSWORD=%s\nDB_HOST=%s\nDB_PORT=%s\n" \
            "${{ secrets.DB_NAME }}" \
            "${{ secrets.DB_USER }}" \
            "${{ secrets.DB_PASSWORD }}" \
            "${{ secrets.DB_HOST }}" \
            "${{ secrets.DB_PORT }}" > .env

      - name: Load season
        run: python src/main.py --season ${{ matrix.season }} --only load

  enrich:
    needs: load
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e .

      - name: Write .env
        run: |
          printf "DB_NAME=%s\nDB_USER=%s\nDB_PASSWORD=%s\nDB_HOST=%s\nDB_PORT=%s\n" \
            "${{ secrets.DB_NAME }}" \
            "${{ secrets.DB_USER }}" \
            "${{ secrets.DB_PASSWORD }}" \
            "${{ secrets.DB_HOST }}" \
            "${{ secrets.DB_PORT }}" > .env

      - name: Enrich players
        run: python src/main.py --only enrich
